<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Reset password | Astraeon BusinessOS</title><link rel="stylesheet" href="../Login/login.css" /></head>
  <body><main class="auth-page"><section class="auth-card" aria-labelledby="reset-title"><a class="brand" href="../Login/login.html"><span class="brand-mark" aria-hidden="true">A</span><span class="brand-name">ASTRAEON <small>BUSINESSOS</small></span></a><header class="auth-heading"><p class="eyebrow">ACCOUNT RECOVERY</p><h1 id="reset-title">Reset Password</h1><p>Enter the reset OTP and choose a new password.</p></header><form class="auth-form" id="reset-form" novalidate><label for="otp">OTP</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required /><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required /><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required /><p class="form-message" id="form-message" role="status" aria-live="polite"></p><button class="primary-button" type="submit">Reset Password <span aria-hidden="true">→</span></button></form></section></main><script src="../../shared/api.js"></script><script src="reset-password.js"></script></body>
</html>
