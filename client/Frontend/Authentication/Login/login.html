<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Astraeon BusinessOS." />
    <title>Sign in | Astraeon BusinessOS</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="login-title">
        <a class="brand" href="login.html" aria-label="Astraeon BusinessOS home">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span class="brand-name">ASTRAEON <small>BUSINESSOS</small></span>
        </a>

        <header class="auth-heading">
          <p class="eyebrow">RESTAURANT OPERATIONS</p>
          <h1 id="login-title">Welcome Back</h1>
          <p>Sign in to orchestrate your restaurant with effortless precision.</p>
        </header>

        <form class="auth-form" id="login-form" novalidate>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@restaurant.com" required />

          <div class="field-label-row">
            <label for="password">Password</label>
            <a class="text-link" href="forgot-password.html">Forgot Password?</a>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />

          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
          <button class="primary-button" type="submit">Sign In <span aria-hidden="true">→</span></button>
        </form>

        <footer class="auth-footer">© <span id="year"></span> Astraeon BusinessOS. Crafted for hospitality.</footer>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
