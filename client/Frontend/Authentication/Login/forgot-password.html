<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Request an Astraeon BusinessOS password reset OTP." />
    <title>Reset password | Astraeon BusinessOS</title>
    <link rel="stylesheet" href="forgot-password.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="forgot-password-title">
        <a class="brand" href="login.html" aria-label="Return to Astraeon BusinessOS sign in">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span class="brand-name">ASTRAEON <small>BUSINESSOS</small></span>
        </a>

        <header class="auth-heading">
          <p class="eyebrow">ACCOUNT RECOVERY</p>
          <h1 id="forgot-password-title">Forgot Your Password?</h1>
          <p>Enter your registered email address to receive a six-digit password reset OTP.</p>
        </header>

        <form class="auth-form" id="forgot-password-form" novalidate>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@restaurant.com" required />
          <output class="form-message" id="form-message"></output>
          <button class="primary-button" type="submit">Send Reset OTP <span aria-hidden="true">→</span></button>
        </form>

        <a class="back-link" href="login.html"><span aria-hidden="true">←</span> Back to Login</a>
        <footer class="auth-footer">© <span id="year"></span> Astraeon BusinessOS. Crafted for hospitality.</footer>
      </section>
    </main>
    <script src="../../shared/api.js"></script>
    <script src="forgot-password.js"></script>
  </body>
</html>
